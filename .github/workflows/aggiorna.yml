name: Aggiorna mappa LA28

# Repo map-q-la28, file .github/workflows/aggiorna.yml.
# Novità del 25/11/2026 (scheda 04):
#   1) secondo tentativo automatico di pubblicazione: se actions/deploy-pages fallisce per
#      QUALSIASI motivo (visti finora: "No artifacts named github-pages were found" e
#      "Deployment failed, try again later", entrambi problemi temporanei di GitHub), il workflow
#      aspetta 30 secondi e riprova una volta sola;
#   2) actions aggiornate alle versioni che girano su Node.js 24 (tolto l'avviso "Node.js 20 is
#      deprecated"): checkout v6, setup-python v6, configure-pages v6, upload-pages-artifact v5,
#      deploy-pages v5.
# Novità del 22/11/2026 (scheda 50): passaggio "Tasto Home" (aggiungi_home.py) subito prima della
# pubblicazione: mette il tasto «🏠 Home» nella testata di tutte le pagine pubblicate. Non salva
# nulla nel repository: modifica solo la copia che va su GitHub Pages.
# Novità del 19/11/2026 (scheda 43): passaggio "Performance Tennistavolo" (aggiorna_tennistavolo_performance.py).
# Novità del 19/11/2026 (scheda 39): passaggio "Performance Vela" (aggiorna_vela_performance.py).
# Correzione del 18/11/2026 (scheda 37): il passaggio "Salva data.json nel repository" riprende
# le modifiche salvate da altri nel frattempo prima di salvare (prima falliva con "rejected").
on:
  workflow_dispatch:   # lancio a mano da Actions > Run workflow
  schedule:
    - cron: "*/15 * * * *"   # controllo automatico ogni 15 minuti (ora UTC)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # L'indirizzo del sito lo dà il passaggio di pubblicazione che è riuscito:
      # il primo tentativo ("pubblica") oppure, se quello è fallito, il secondo ("pubblica2").
      url: ${{ steps.pubblica.outputs.page_url || steps.pubblica2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6          # NOVITÀ 25/11: era v4 (Node 20)
      - uses: actions/setup-python@v6      # NOVITÀ 25/11: era v5 (Node 20)
        with:
          python-version: "3.12"
      - name: Leggi Notion e aggiorna data.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_dati.py
      - name: Leggi le previsioni Wrestling e aggiorna wrestling.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_wrestling.py
      - name: Leggi la simulazione Tennis e aggiorna tennis.json
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_tennis.py
      - name: Leggi il calendario delle qualificazioni e aggiorna calendario.json
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_calendario.py
      - name: Qualificati LA28 - tipo di quota, qualificati.json e db Notion
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_qualificati.py
      - name: Performance Judo - ricalcola il WON e aggiorna judo-performance.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_judo_performance.py
      - name: Performance Badminton - ricalcola il WON e aggiorna badminton-performance.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_badminton_performance.py
      - name: Performance Pentathlon - legge il PTS e aggiorna pentathlon-performance.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_pentathlon_performance.py
      - name: Performance Scherma - ricalcola il FEN e aggiorna scherma-performance.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_scherma_performance.py
      - name: Performance Wrestling - statistiche incontri e aggiorna wrestling-performance.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_wrestling_performance.py
      - name: Performance Vela - ricalcola il WON, aggiunge l'ELO e aggiorna vela-performance.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_vela_performance.py
      - name: Performance Tennistavolo - ricalcola il WON, aggiunge l'ELO e aggiorna tennistavolo-performance.json
        continue-on-error: true     # se fallisce, la mappa si aggiorna comunque
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python aggiorna_tennistavolo_performance.py
      - name: Salva data.json nel repository
        id: salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json wrestling.json tennis.json
          git add calendario.json 2>/dev/null || true
          git add qualificati.json 2>/dev/null || true
          git add judo-performance.json 2>/dev/null || true
          git add badminton-performance.json 2>/dev/null || true
          git add pentathlon-performance.json 2>/dev/null || true
          git add scherma-performance.json 2>/dev/null || true
          git add wrestling-performance.json 2>/dev/null || true
          git add vela-performance.json 2>/dev/null || true
          git add tennistavolo-performance.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "cambiato=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Aggiorna i qualificati LA28"
          # Mentre questo lancio lavora, altri possono salvare file nel repository (l'agente
          # badminton salva badminton.json, i calcoli ELO del lunedì i loro *-elo.json). Allora
          # GitHub rifiuta il salvataggio ("rejected ... fetch first"). Prima di salvare riprendo
          # quindi le loro modifiche ("git pull --rebase"): sono file diversi dai nostri, quindi si
          # uniscono da soli. Fino a 3 tentativi, a 10 secondi di distanza.
          for tentativo in 1 2 3; do
            if git pull --rebase && git push; then
              echo "cambiato=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true   # se l'unione non riesce, rimetto tutto com'era e riprovo
            echo "Tentativo $tentativo non riuscito: riprovo tra 10 secondi"
            sleep 10
          done
          echo "Non sono riuscito a salvare i file: ci riprova il prossimo lancio (ogni 15 minuti)"
          exit 1
      - name: Tasto Home - aggiunge «🏠 Home» nella testata di tutte le pagine
        # Parte dopo il salvataggio, quindi le pagine modificate NON finiscono nel repository:
        # il tasto c'è solo nel sito pubblicato.
        if: steps.salva.outputs.cambiato == '1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true     # se fallisce, il sito si pubblica comunque (senza il tasto)
        run: python aggiungi_home.py
      - if: steps.salva.outputs.cambiato == '1' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6         # NOVITÀ 25/11: era v5 (Node 20)
      - name: Prepara il sito da pubblicare
        if: steps.salva.outputs.cambiato == '1' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5   # NOVITÀ 25/11: era v3
        # Dalla v4 i file "nascosti" (quelli il cui nome comincia con un punto, es. .nojekyll)
        # NON vengono pubblicati (.git e .github non lo erano neanche prima). Se un giorno una
        # pagina ne avesse bisogno, aggiungere qui sotto la riga  include-hidden-files: true
        with:
          path: .
      # ---- Pubblicazione con secondo tentativo (NOVITÀ del 25/11/2026) ----------------------
      - name: Pubblica su GitHub Pages (1° tentativo)
        id: pubblica
        if: steps.salva.outputs.cambiato == '1' || github.event_name == 'workflow_dispatch'
        # "continue-on-error": se questo tentativo fallisce, per QUALSIASI errore, il workflow
        # NON si ferma e passa ai due passaggi qui sotto. Se invece riesce, vengono saltati.
        # "@v5" prende da solo l'ultima versione 5.x (oggi la 5.0.1, che controlla l'esito della
        # pubblicazione con attese crescenti): non serve scrivere il numero preciso.
        continue-on-error: true
        uses: actions/deploy-pages@v5            # NOVITÀ 25/11: era v4 (Node 20)
      - name: Primo tentativo fallito - aspetto 30 secondi
        # "outcome" è il risultato vero del passaggio "pubblica" ('success', 'failure' o
        # 'skipped' se non è partito). Questo passaggio parte solo se è 'failure', qualunque sia
        # il messaggio di errore: la condizione non guarda il testo dell'errore.
        if: steps.pubblica.outcome == 'failure'
        run: |
          echo "Il 1° tentativo di pubblicazione non è riuscito: il motivo è scritto nel passaggio qui sopra."
          echo "Errori già visti: 'No artifacts named github-pages were found', 'Deployment failed, try again later'."
          echo "Sono problemi temporanei di GitHub: aspetto 30 secondi e riprovo una volta."
          sleep 30
      - name: Pubblica su GitHub Pages (2° tentativo)
        id: pubblica2
        if: steps.pubblica.outcome == 'failure'
        # Usa lo stesso sito già preparato sopra (non serve rifarlo). Qui NON c'è
        # continue-on-error: se fallisce anche questo, il lancio diventa rosso e me ne accorgo.
        # I dati sono comunque già salvati nel repository: basta un nuovo Run workflow.
        uses: actions/deploy-pages@v5
