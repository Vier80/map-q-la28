name: ELO Badminton

# Repo map-q-la28, file .github/workflows/elo-badminton.yml
# (versione 2 del 17/11/2026, scheda 33, sessione 3).
# Parte in due modi:
#   - a mano: Actions -> ELO Badminton -> Run workflow;
#   - da solo il LUNEDÌ, alla fine del lancio vero dell'agente badminton (repo agente-badminton),
#     che parte ogni mattina da cron-job.org.
# NOVITÀ della sessione 3: se badminton-elo.json è stato salvato, alla fine avvia
# "Aggiorna mappa LA28", che rifà badminton-performance.json con l'ELO e ripubblica la pagina.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: "Solo prova: calcola l'ELO e prepara gli elenchi, senza scrivere su Notion"
        type: boolean
        default: true

permissions:
  contents: write          # serve per salvare badminton-elo.json nel repository
  actions: write           # NOVITÀ sessione 3: serve per avviare "Aggiorna mappa LA28" alla fine

# due calcoli contemporanei scriverebbero due volte in Athletes: il secondo aspetta il primo
concurrency:
  group: elo-badminton
  cancel-in-progress: false

jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcola l'ELO (e, se non è una prova, scrive in Athletes)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ inputs.solo_prova }}
          TEMPO_MAX_MINUTI: "165"
        # lo script scrive da solo il rapporto in rapporto_elo_badminton.txt
        run: python -u elo_badminton.py

      - name: Conserva rapporto ed elenchi (Artifacts in fondo alla pagina del lancio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elo-badminton
          path: |
            rapporto_elo_badminton.txt
            badminton_elo_abbinati.csv
            badminton_elo_da_creare.csv
            badminton_elo_incerti.csv
            badminton-elo.json
          if-no-files-found: ignore

      - name: Salva badminton-elo.json nel repository (solo nel lancio vero)
        id: salva
        # "always()" = anche se lo script ha avuto qualche errore di scrittura: il JSON è comunque valido
        if: always() && format('{0}', inputs.solo_prova) == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badminton-elo.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "badminton-elo.json invariato"
            echo "salvato=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Aggiorna l'ELO badminton"
          # il workflow della mappa salva file ogni 15 minuti: prima di salvare prendo le sue modifiche
          for tentativo in 1 2 3; do
            if git pull --rebase && git push; then
              echo "salvato=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Non sono riuscito a salvare badminton-elo.json"
          exit 1

      # ------------------------------------------------------------------ NOVITÀ della sessione 3
      - name: Ripubblica subito il sito (avvia "Aggiorna mappa LA28")
        # Solo se badminton-elo.json è stato davvero salvato. La mappa rifà badminton-performance.json con
        # il nuovo ELO (aggiorna_badminton_performance.py) e ripubblica GitHub Pages.
        # Il token automatico github.token non fa partire altri workflow con un push, ma può farlo
        # con "workflow run" (permesso actions: write qui sopra).
        # Se questo passaggio fallisce non succede nulla di grave: ci pensa il giro dei 15 minuti.
        if: always() && steps.salva.outputs.salvato == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run aggiorna.yml --repo "${{ github.repository }}" \
            && echo "Ho avviato 'Aggiorna mappa LA28': la pagina si aggiorna entro pochi minuti." \
            || echo "ATTENZIONE: non sono riuscito ad avviare la mappa; si aggiornerà al prossimo giro (15-30 minuti)."
