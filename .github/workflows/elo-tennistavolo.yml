name: ELO Tennis Tavolo

# Repo map-q-la28, file .github/workflows/elo-tennistavolo.yml
# (versione 2 del 19/11/2026, scheda 43, sessione 3; la versione 1 era della scheda 42).
# Parte in due modi:
#   - a mano: Actions -> ELO Tennis Tavolo -> Run workflow;
#   - da solo il LUNEDÌ, alla fine del lancio vero dell'agente tennistavolo (repo agente-tennistavolo),
#     che parte ogni mattina da cron-job.org.
# NOVITÀ della versione 2: se tennistavolo-elo.json è stato salvato, alla fine avvia
# "Aggiorna mappa LA28", che rifà tennistavolo-performance.json con l'ELO e ripubblica le pagine.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: "Solo prova: calcola l'ELO e prepara gli elenchi, senza scrivere su Notion"
        type: boolean
        default: true

permissions:
  contents: write          # serve per salvare tennistavolo-elo.json nel repository
  actions: write           # NOVITÀ versione 2: serve per avviare "Aggiorna mappa LA28" alla fine

# due calcoli contemporanei scriverebbero due volte in Athletes: il secondo aspetta il primo
concurrency:
  group: elo-tennistavolo
  cancel-in-progress: false

jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcola l'ELO (e, se non è una prova, scrive in Athletes)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ inputs.solo_prova }}
          TEMPO_MAX_MINUTI: "165"
        # lo script scrive da solo il rapporto in rapporto_elo_tennistavolo.txt
        run: python -u elo_tennistavolo.py

      - name: Conserva rapporto, elenchi e dati letti (Artifacts in fondo alla pagina del lancio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elo-tennistavolo
          path: |
            rapporto_elo_tennistavolo.txt
            tennistavolo_elo_abbinati.csv
            tennistavolo_elo_da_creare.csv
            tennistavolo_elo_incerti.csv
            tennistavolo-elo.json
            tennistavolo_raw.json
          if-no-files-found: ignore

      - name: Salva tennistavolo-elo.json nel repository (solo nel lancio vero)
        id: salva
        # "always()" = anche se lo script ha avuto qualche errore di scrittura: il JSON è comunque valido
        if: always() && format('{0}', inputs.solo_prova) == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennistavolo-elo.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "tennistavolo-elo.json invariato"
            echo "salvato=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Aggiorna l'ELO tennistavolo"
          # il workflow della mappa salva file ogni 15 minuti: prima di salvare prendo le sue modifiche
          for tentativo in 1 2 3; do
            if git pull --rebase && git push; then
              echo "salvato=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true   # se l'unione non riesce, rimetto tutto com'era e riprovo
            sleep 10
          done
          echo "Non sono riuscito a salvare tennistavolo-elo.json"
          exit 1

      # ------------------------------------------------------------------ NOVITÀ della versione 2
      - name: Ripubblica subito il sito (avvia "Aggiorna mappa LA28")
        # Solo se tennistavolo-elo.json è stato davvero salvato. La mappa rifà tennistavolo-performance.json
        # con il nuovo ELO (aggiorna_tennistavolo_performance.py) e ripubblica GitHub Pages; anche la pagina
        # tennistavolo.html legge il nuovo ELO a inizio torneo.
        # Il token automatico github.token non fa partire altri workflow con un push, ma può farlo
        # con "workflow run" (permesso actions: write qui sopra).
        # Se questo passaggio fallisce non succede nulla di grave: ci pensa il giro dei 15 minuti.
        if: always() && steps.salva.outputs.salvato == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run aggiorna.yml --repo "${{ github.repository }}" \
            && echo "Ho avviato 'Aggiorna mappa LA28': le pagine si aggiornano entro pochi minuti." \
            || echo "ATTENZIONE: non sono riuscito ad avviare la mappa; si aggiornerà al prossimo giro (15-30 minuti)."
