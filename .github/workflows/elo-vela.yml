name: ELO Vela

# Repo map-q-la28, file .github/workflows/elo-vela.yml (versione 2 del 19/11/2026, scheda 39).
# NOVITÀ della versione 2: se vela-elo.json è stato salvato, alla fine avvia "Aggiorna mappa LA28",
# che rifà vela-performance.json con il nuovo ELO e ripubblica la pagina vela-performance.html.
# Parte SOLO a mano (decisione di Gualtiero, foglio punto 22): Actions -> ELO Vela -> Run workflow.
# Legge il db "⛵ Agente Vela", calcola l'ELO e (se non è una prova) scrive "ELO Vela" e "ID WS" in Athletes.
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: "Solo prova: calcola l'ELO e prepara gli elenchi, senza scrivere su Notion"
        type: boolean
        default: true

permissions:
  contents: write          # serve per salvare vela-elo.json nel repository (lancio vero)
  actions: write           # NOVITÀ v2: serve per avviare "Aggiorna mappa LA28" alla fine

# due calcoli contemporanei scriverebbero due volte in Athletes: il secondo aspetta il primo
concurrency:
  group: elo-vela
  cancel-in-progress: false

jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcola l'ELO (e, se non è una prova, scrive in Athletes)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ inputs.solo_prova }}
          TEMPO_MAX_MINUTI: "165"
        # lo script scrive da solo il rapporto in rapporto_elo_vela.txt
        run: python -u elo_vela.py

      - name: Conserva rapporto ed elenchi (Artifacts in fondo alla pagina del lancio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elo-vela
          path: |
            rapporto_elo_vela.txt
            vela_elo_abbinati.csv
            vela_elo_da_creare.csv
            vela_elo_incerti.csv
            vela_elo_uniti.csv
            vela-elo.json
            vela_raw.json
          if-no-files-found: ignore

      - name: Salva vela-elo.json nel repository (solo nel lancio vero)
        # serve alla pagina performance della vela
        id: salva
        if: always() && format('{0}', inputs.solo_prova) == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vela-elo.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "vela-elo.json invariato"
            echo "salvato=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Aggiorna l'ELO vela"
          # il workflow della mappa salva file ogni 15 minuti: prima di salvare prendo le sue modifiche
          for tentativo in 1 2 3; do
            if git pull --rebase && git push; then
              echo "salvato=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Non sono riuscito a salvare vela-elo.json"
          exit 1

      # ------------------------------------------------------------------ NOVITÀ della versione 2
      - name: Ripubblica subito il sito (avvia "Aggiorna mappa LA28")
        # Solo se vela-elo.json è stato davvero salvato. La mappa rifà vela-performance.json con il nuovo
        # ELO (aggiorna_vela_performance.py) e ripubblica GitHub Pages. Il token automatico github.token
        # non fa partire altri workflow con un push, ma può farlo con "workflow run" (permesso actions: write).
        # Se questo passaggio fallisce non succede nulla di grave: ci pensa il giro dei 15 minuti.
        if: always() && steps.salva.outputs.salvato == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run aggiorna.yml --repo "${{ github.repository }}" \
            && echo "Ho avviato 'Aggiorna mappa LA28': la pagina si aggiorna entro pochi minuti." \
            || echo "ATTENZIONE: non sono riuscito ad avviare la mappa; si aggiornerà al prossimo giro (15-30 minuti)."
