<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risultati Badminton BWF · Super 300 e 500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Stessa veste di squash.html, in verde menta pastello: testata, fascia con anello e dettaglio, quattro totali, carte. */
:root {
  --bg: #ffffff; --fg: #1f3a31; --muted: #5f776e; --line: #d5ece3; --card: #f9fdfb; --soft: #edf8f3; --track: #dcefe7;
  --ink: #5fb89a; --ink-2: #a8dcc9; --ink-t: #2f8a6c; --gold: #a8782a;
  --MS: #7da9e8; --WS: #e39bbd; --MD: #a993dc; --WD: #e8a08a; --XD: #d9c060; --shadow: rgba(30, 90, 70, .10);
  --font: "Quicksand", "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a17; --fg: #e2f2ec; --muted: #93aca2; --line: #2c3d36; --card: #18221e; --soft: #1c2823; --track: #2a3a33;
  --ink: #7fd1b3; --ink-2: #b5e6d4; --ink-t: #9fe0c8; --gold: #e3c15c;
  --MS: #8fb6ee; --WS: #eab0cb; --MD: #b9a6e6; --WD: #eeb09e; --XD: #e3cd77; --shadow: rgba(0, 0, 0, .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121a17; --fg: #e2f2ec; --muted: #93aca2; --line: #2c3d36; --card: #18221e; --soft: #1c2823; --track: #2a3a33;
  --ink: #7fd1b3; --ink-2: #b5e6d4; --ink-t: #9fe0c8; --gold: #e3c15c;
  --MS: #8fb6ee; --WS: #eab0cb; --MD: #b9a6e6; --WD: #eeb09e; --XD: #e3cd77; --shadow: rgba(0, 0, 0, .4); color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 16px/1.4 var(--font) }
h1, h2, h3, p { margin: 0 }
.guscio { max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.testa { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px }
.titolo { flex: 1 1 320px; min-width: 0 }
.occhiello { font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-t) }
h1 { font: 600 2.1rem/1.2 var(--font); text-wrap: balance }
.vai { flex: 1 1 220px; max-width: 320px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 10px; padding: 11px 16px; color: inherit; text-decoration: none; border: 1.5px solid var(--line); border-radius: 18px }
.vai:hover { border-color: var(--ink) }
.vai b { font-weight: 600 } .vai span { grid-column: 1; font-size: .84rem; color: var(--muted) } .vai i { grid-row: 1 / 3; grid-column: 2; font-style: normal; color: var(--ink-t); font-size: 1.2rem }
button.vai { font: inherit; text-align: left; background: none; cursor: pointer }

.fascia { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); background: var(--soft); border: 1.5px solid var(--line); border-radius: 24px }
.avanz { display: flex; align-items: center; gap: 24px; padding: 22px 26px; min-width: 0; align-self: start; position: sticky; top: 8px }
.anello { position: relative; flex: none; width: 168px; height: 168px; display: grid; place-items: center; text-align: center }
.anello svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.anello small { display: block; font-size: .8rem; color: var(--muted) }
.anello b { display: block; font: 600 2rem/1.1 var(--font); font-variant-numeric: tabular-nums }
.traccia { fill: none; stroke: var(--track) } .arco { fill: none; stroke: var(--ink); stroke-linecap: round }
.avanz h2 { font: 600 1.45rem/1.25 var(--font); text-wrap: balance; overflow-wrap: anywhere }
.avanz p { color: var(--muted) }
.avanz a { color: var(--ink-t); font-weight: 600 }
.etichetta { margin-bottom: 4px; font-size: .78rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-t) }
.dettaglio { min-width: 0; padding: 22px 26px; border-left: 1.5px solid var(--line) }
.dettaglio h2 { font: 600 1.45rem/1.25 var(--font) }
.dettaglio .etichetta { color: var(--gold) }
.dettaglio > p { color: var(--muted) }
.chip { display: inline-block; padding: 3px 10px; font-size: .86rem; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; text-decoration: none; font-variant-numeric: tabular-nums }
a.chip:hover, button.chip:hover { border-color: var(--ink) }
button.chip { font: inherit; font-size: .86rem; cursor: pointer }
.titoli { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }

.classifica { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px }
.classifica.lunga { max-height: 560px; overflow-y: auto; padding-right: 4px; overscroll-behavior: contain }
.riga { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 8px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px }
.riga.cerca-ok { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--ink) }
.pos { font-weight: 700; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center }
.disc { display: inline-grid; place-items: center; min-width: 30px; padding: 2px 4px; font-size: .74rem; font-weight: 700; color: #1d2b26; border-radius: 8px }
.disc.MS { background: var(--MS) } .disc.WS { background: var(--WS) } .disc.MD { background: var(--MD) } .disc.WD { background: var(--WD) } .disc.XD { background: var(--XD) }
.chi { min-width: 0 } .chi b { font-weight: 600; overflow-wrap: anywhere } .chi small { display: block; font-size: .8rem; color: var(--muted); overflow-wrap: anywhere }
.perc { text-align: right; font-variant-numeric: tabular-nums } .perc b { font: 700 1.1rem/1.1 var(--font); color: var(--ink-t) } .perc small { display: block; font-size: .76rem; color: var(--muted); white-space: nowrap }
.riga .noc { font-size: .78rem; padding: 1px 8px; margin-left: 4px; vertical-align: 1px }
.sezione { margin: 14px 0 0; font-size: .78rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.schede { display: inline-flex; flex-wrap: wrap; gap: 2px; margin-top: 14px; padding: 4px; background: var(--soft); border-radius: 14px }
.schede button, .gruppo button { padding: 6px 12px; font: 600 .9rem var(--font); color: var(--muted); background: none; border: 0; border-radius: 10px; cursor: pointer }
.schede button[aria-pressed="true"], .gruppo button[aria-pressed="true"] { color: var(--fg); background: var(--bg); box-shadow: 0 1px 3px var(--shadow) }

.totali { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--line); border-radius: 22px }
.totale { padding: 12px 18px; text-align: center; border-right: 1px solid var(--line) } .totale:last-child { border-right: 0 }
.totale b { display: block; font: 600 1.9rem/1.2 var(--font); font-variant-numeric: tabular-nums }
.totale span { font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted) }

.filtri { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px }
#cerca { flex: 1 1 240px; min-width: 0; max-width: 460px; height: 44px; padding: 0 16px; font: 500 1rem var(--font); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px }
#cerca::placeholder { color: var(--muted) }
.gruppo { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; background: var(--soft); border-radius: 14px }

.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px }
.carta { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 16px; text-align: left; font: inherit; color: inherit; background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; cursor: pointer }
.carta:hover { border-color: var(--ink); box-shadow: 0 5px 14px var(--shadow) }
.carta[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--ink) }
.carta.futuro { border-style: dashed; background: var(--bg) } .carta.futuro h3, .carta.futuro .cifre b { color: var(--muted) }
.icona { display: grid; place-items: center; width: 50px; height: 50px; font-size: 1.7rem; background: var(--bg); border: 1px solid var(--line); border-radius: 13px }
.carta h3 { font: 600 1.15rem/1.2 var(--font); overflow-wrap: anywhere }
.carta h3 small { display: block; font-size: .8rem; font-weight: 600; color: var(--muted) }
.cat { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; vertical-align: 1px; background: var(--ink) } .cat.s300 { background: var(--ink-2) }
.mini { position: relative; width: 58px; height: 58px; display: grid; place-items: center; font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums }
.mini svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.barra { grid-column: 1 / -1; display: flex; height: 9px; background: var(--track); border-radius: 999px; overflow: hidden }
.barra i { display: block; height: 100% }
.barra .MS { background: var(--MS) } .barra .WS { background: var(--WS) } .barra .MD { background: var(--MD) } .barra .WD { background: var(--WD) } .barra .XD { background: var(--XD) }
.cifre { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px }
.cifre div { min-width: 0; padding: 7px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px }
.cifre b { display: block; font: 600 1.05rem/1.2 var(--font); color: var(--ink-t); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cifre span { display: block; font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.vuoto { padding: 20px; color: var(--muted) }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--muted) }
.legenda span { display: inline-flex; align-items: center; gap: 6px } .legenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block }
.nazioni h2 { font: 600 1.25rem/1.25 var(--font); margin-bottom: 8px }
.nazioni .titoli { margin-top: 0 }
.nota { max-width: 90ch; font-size: .86rem; color: var(--muted) }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px }

#stampa { display: none }
@media print {
  @page { size: A4; margin: 11mm }
  :root:not([data-theme="x"]) { color-scheme: light !important }
  html, body { background: #fff !important; color: #1f3a31 !important; font-size: 9pt }
  .guscio { display: block; max-width: none; padding: 0 }
  .guscio > :not(#stampa) { display: none !important }
  #stampa { display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact }
  .s-occ { font-size: 8pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #2f8a6c }
  #stampa h1 { font: 700 18pt/1.2 var(--font); margin: 1mm 0 2mm }
  .s-sint { font-size: 9pt; margin: 0 0 4mm; padding-bottom: 3mm; border-bottom: 1.5pt solid #5fb89a }
  .s-griglia { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 8mm; align-items: start }
  .s-cat { break-inside: avoid; page-break-inside: avoid; margin: 0 0 4mm }
  .s-cat h2 { font: 700 10pt/1.2 var(--font); margin: 0; padding: 1.2mm 2mm; background: #edf8f3; border-left: 2.5pt solid #5fb89a; color: #1f3a31 }
  .s-sub { font-size: 7pt; color: #5f776e; margin: .8mm 0 1mm 2mm }
  .s-cat table { width: 100%; border-collapse: collapse; font-size: 7pt; line-height: 1.15; font-variant-numeric: tabular-nums }
  .s-cat th { text-align: left; font-weight: 700; font-size: 6.6pt; color: #5f776e; padding: 0 1.5mm .6mm; border-bottom: .6pt solid #5fb89a }
  .s-cat td { padding: .3mm 1.5mm; border-bottom: .4pt solid #d5ece3; vertical-align: top }
  .s-cat .v { font-weight: 700; white-space: nowrap; color: #2f8a6c }
  .s-cat .n { white-space: nowrap }
  .s-nota { font-size: 7.2pt; color: #5f776e; margin-top: 2mm; padding-top: 2mm; border-top: .6pt solid #d5ece3 }
}
@media (max-width: 900px) {
  .avanz { position: static }
  h1 { font-size: 1.6rem }
  .fascia { grid-template-columns: minmax(0, 1fr) } .dettaglio { border-left: 0; border-top: 1.5px solid var(--line) }
  .totali { grid-template-columns: repeat(2, minmax(0, 1fr)) } .totale:nth-child(2) { border-right: 0 } .totale:nth-child(-n+2) { border-bottom: 1px solid var(--line) }
  .vai { max-width: none }
}
@media (max-width: 520px) { .avanz { flex-direction: column; text-align: center; padding: 18px } .dettaglio { padding: 18px } }
</style>
</head>
<body>
<div class="guscio">
  <header class="testa">
    <div class="titolo">
      <p class="occhiello" id="data">BWF World Tour</p>
      <h1>🏸 Risultati Badminton · Super 300 e 500</h1>
    </div>
    <a class="vai" href="https://bwfbadminton.com/calendar/" target="_blank" rel="noopener"><b>Calendario BWF</b><span>Il sito ufficiale</span><i>↗</i></a>
    <a class="vai" href="index.html"><b>Mappa</b><span>Qualificati LA28 nel mondo</span><i>›</i></a>
    <button class="vai" id="pdf" type="button" title="Si apre la stampa: scegli «Salva come PDF»"><b>Scarica PDF</b><span>Albo d'oro della stagione</span><i>↓</i></button>
  </header>

  <section class="fascia">
    <div class="avanz">
      <div class="anello" id="anello"></div>
      <div id="sintesi"></div>
    </div>
    <div class="dettaglio" id="dettaglio" aria-live="polite"></div>
  </section>

  <section class="totali" id="totali"></section>

  <div class="filtri">
    <input id="cerca" type="search" placeholder="Cerca un giocatore o un NOC…" autocomplete="off" aria-label="Cerca un giocatore o un NOC">
    <div class="gruppo" id="categoria" role="group" aria-label="Filtra per categoria"></div>
    <div class="gruppo" id="statof" role="group" aria-label="Filtra per stato del torneo"></div>
  </div>
  <div class="legenda">
    <span><i style="background:var(--MS)"></i>Singolare maschile (MS)</span>
    <span><i style="background:var(--WS)"></i>Singolare femminile (WS)</span>
    <span><i style="background:var(--MD)"></i>Doppio maschile (MD)</span>
    <span><i style="background:var(--WD)"></i>Doppio femminile (WD)</span>
    <span><i style="background:var(--XD)"></i>Doppio misto (XD)</span>
  </div>

  <div class="griglia" id="griglia"></div>

  <section class="nazioni" id="nazioni"></section>
  <p class="nota" id="nota"></p>
  <div id="stampa"></div>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, testo) => { const e = document.createElement(tag); if (cls) e.className = cls; if (testo != null) e.textContent = testo; return e; };
  const num = (n) => n.toLocaleString("it-IT");
  const NS = "http://www.w3.org/2000/svg";
  function cerchio(dim, spessore, p) {
    const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", `0 0 ${dim} ${dim}`); s.setAttribute("aria-hidden", "true");
    const r = (dim - spessore) / 2, c = 2 * Math.PI * r;
    [["traccia", 0], ["arco", Math.min(100, p)]].forEach(([cl, v]) => {
      const o = document.createElementNS(NS, "circle");
      o.setAttribute("class", cl); o.setAttribute("cx", dim / 2); o.setAttribute("cy", dim / 2); o.setAttribute("r", r); o.setAttribute("stroke-width", spessore);
      if (cl === "arco") { o.setAttribute("stroke-dasharray", `${c * v / 100} ${c}`); if (!v) o.setAttribute("stroke-opacity", "0"); }
      s.append(o);
    });
    return s;
  }

  let dati;
  try { dati = await fetch("badminton.json?v=" + Date.now()).then((r) => { if (!r.ok) throw 0; return r.json(); }); }
  catch (e) { $("nota").textContent = "I risultati non si caricano: ricarica la pagina."; return; }

  const DISC = { MS: "Singolare maschile", WS: "Singolare femminile", MD: "Doppio maschile", WD: "Doppio femminile", XD: "Doppio misto" };
  const ORD_DISC = Object.keys(DISC);
  const TURNI = { "Final": ["F", 0], "Semi Final": ["SF", 1], "Quarter Final": ["QF", 2], "Round of 16": ["16", 3], "Round of 32": ["32", 4], "Round of 64": ["64", 5] };
  const PER_TORNEO = 155;   // 5 tabelloni da 32: 31 incontri ciascuno

  const incontri = (dati.incontri || []).map(([t, d, r, p1, n1, p2, n2, s, data]) => ({ t, d, r, p1, n1, p2, n2, s, data }));
  const perTorneo = {};
  incontri.forEach((m) => { (perTorneo[m.t] = perTorneo[m.t] || []).push(m); });
  const tornei = (dati.tornei || []).map((t) => {
    const ms = (perTorneo[t.nome] || []).slice().sort((a, b) => ORD_DISC.indexOf(a.d) - ORD_DISC.indexOf(b.d) || (TURNI[a.r] || ["", 9])[1] - (TURNI[b.r] || ["", 9])[1] || a.data.localeCompare(b.data));
    const finali = {}; ms.filter((m) => m.r === "Final").forEach((m) => { finali[m.d] = m; });
    const conta = {}; ms.forEach((m) => { conta[m.d] = (conta[m.d] || 0) + 1; });
    return { ...t, ms, finali, conta };
  });
  const validi = tornei.filter((t) => t.stato !== "annullato");
  const conclusi = validi.filter((t) => t.stato === "concluso");

  const meseCorto = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short" });
  const dataLunga = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" });
  const giorno = (s) => new Date(s + "T12:00:00");
  const periodo = (t) => {
    if (!t.inizio) return "";
    const a = giorno(t.inizio), b = giorno(t.fine || t.inizio);
    return a.getMonth() === b.getMonth() ? `${a.getDate()}–${meseCorto.format(b)}` : `${meseCorto.format(a)} – ${meseCorto.format(b)}`;
  };
  const anno = (dati.stagioni || []).join("–") || (dati.aggiornato || "").slice(0, 4);
  $("data").textContent = `BWF World Tour ${anno} · aggiornato al ${dataLunga.format(giorno(dati.aggiornato))}`;

  const nocDi = (codice) => (codice || "").split("/").filter(Boolean);
  const titoli = {};
  conclusi.forEach((t) => Object.values(t.finali).forEach((m) => nocDi(m.n1).forEach((n) => { titoli[n] = (titoli[n] || 0) + 1; })));
  const nocTutti = new Set(); incontri.forEach((m) => [...nocDi(m.n1), ...nocDi(m.n2)].forEach((n) => nocTutti.add(n)));
  const classificaTitoli = Object.entries(titoli).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  [[conclusi.length, "Tornei conclusi"], [incontri.length, "Incontri"], [nocTutti.size, "NOC in campo"], [classificaTitoli.length ? `${classificaTitoli[0][0]} ${classificaTitoli[0][1]}` : "–", "Più titoli vinti"]].forEach(([n, t]) => {
    const d = el("div", "totale"); d.append(el("b", "", typeof n === "number" ? (n ? num(n) : "–") : n), el("span", "", t)); $("totali").append(d);
  });

  // stato della pagina
  const ultimo = conclusi.length ? conclusi[conclusi.length - 1] : null;
  const inCorso = validi.find((t) => t.stato === "in corso");
  let scelto = (inCorso && inCorso.ms.length ? inCorso : ultimo || validi[0] || {}).nome || null;
  let categoria = "tutte", statof = "tutti", disc = "MS";
  const CATEGORIE = { tutte: "Tutte", "Super 500": "Super 500", "Super 300": "Super 300" };
  const STATI = { tutti: "Tutti", concluso: "Conclusi", futuri: "Da giocare" };
  const domanda = () => $("cerca").value.trim().toLowerCase();
  const corrisponde = (m, q) => q && (m.p1.toLowerCase().includes(q) || m.p2.toLowerCase().includes(q) || nocDi(m.n1).some((n) => n.toLowerCase() === q) || nocDi(m.n2).some((n) => n.toLowerCase() === q));

  function punteggio(s) {
    const m = /^(\d+-\d+)\s*\((.*)\)$/.exec(s || "");
    if (m) return [m[1], m[2]];
    const r = /^(\w[\w ]*?)\s*(?:\((.*)\))?$/.exec(s || "");
    return r ? [r[1] === "walkover" ? "w.o." : r[1] === "ritiro" ? "rit." : r[1], r[2] || ""] : [s || "", ""];
  }

  function nocChip(codice) {
    const box = document.createDocumentFragment();
    nocDi(codice).forEach((n) => {
      const b = el("button", "chip noc", n); b.type = "button"; b.title = `Cerca ${n}`;
      b.addEventListener("click", (e) => { e.stopPropagation(); cerca(n); });
      box.append(b);
    });
    return box;
  }

  function riga(m, q, etichetta) {
    const li = el("li", "riga" + (corrisponde(m, q) ? " cerca-ok" : ""));
    const chi = el("div", "chi"), nome = el("b", "", m.p1);
    nome.append(nocChip(m.n1)); chi.append(nome);
    const sm = el("small", "", `b. ${m.p2}${m.n2 ? " (" + m.n2 + ")" : ""}`); chi.append(sm);
    const [g, set] = punteggio(m.s), perc = el("div", "perc");
    perc.append(el("b", "", g), el("small", "", set));
    let pos;
    if (etichetta === "disc") { pos = el("span", "pos"); pos.append(el("span", "disc " + m.d, m.d)); }
    else pos = el("span", "pos", (TURNI[m.r] || [m.r])[0]);
    pos.title = `${DISC[m.d]} · ${m.r}`;
    li.append(pos, chi, perc);
    return li;
  }

  function anello(t) {
    const box = $("anello"), testo = $("sintesi"); box.textContent = ""; testo.textContent = "";
    const dentro = el("div");
    if (t) {
      const n = t.ms.length;
      dentro.append(el("small", "", "incontri"), el("b", "", num(n)), el("small", "", "su " + PER_TORNEO));
      box.append(cerchio(168, 16, n / PER_TORNEO * 100), dentro);
      testo.append(el("p", "etichetta", `${t.categoria} · ${t.stato}`), el("h2", "", `🏸 ${t.nome}`),
        el("p", "", [periodo(t) + " " + (t.inizio || "").slice(0, 4), t.luogo].filter(Boolean).join(" · ")));
      if (t.url) { const a = el("a", "", "Risultati sul sito BWF ↗"); a.href = t.url.replace(/\/?$/, "/") + "results/"; a.target = "_blank"; a.rel = "noopener"; const p = el("p"); p.append(a); testo.append(p); }
    } else {
      dentro.append(el("small", "", "tornei conclusi"), el("b", "", num(conclusi.length)), el("small", "", "su " + num(validi.length)));
      box.append(cerchio(168, 16, validi.length ? conclusi.length / validi.length * 100 : 0), dentro);
      testo.append(el("p", "etichetta", "Stagione " + anno), el("h2", "", `${num(incontri.length)} incontri in ${num(conclusi.length)} tornei`),
        el("p", "", "Clicca un torneo qui sotto per vedere campioni e tabelloni."));
    }
  }

  function dettaglio() {
    const box = $("dettaglio"); box.textContent = "";
    const t = tornei.find((x) => x.nome === scelto);
    anello(t);
    if (!t) {
      box.append(el("p", "etichetta", "Campioni del torneo"), el("h2", "", "Clicca una carta qui sotto"),
        el("p", "", "Qui compaiono i vincitori delle cinque specialità e tutti gli incontri del tabellone principale."));
      return;
    }
    const q = domanda();
    if (!t.ms.length) {
      box.append(el("p", "etichetta", t.stato === "annullato" ? "Torneo annullato" : t.stato === "da giocare" ? "Da giocare" : "In attesa dei risultati"),
        el("h2", "", t.nome), el("p", "", t.stato === "da giocare" ? `Si gioca dal ${dataLunga.format(giorno(t.inizio))} al ${dataLunga.format(giorno(t.fine))}. I risultati arriveranno qui ogni mattina.` : "Nessun incontro concluso per ora."));
      return;
    }
    if (q) {
      const miei = t.ms.filter((m) => corrisponde(m, q));
      box.append(el("p", "etichetta", `Ricerca «${$("cerca").value.trim()}»`), el("h2", "", `${miei.length} incontri in questo torneo`));
      const ol = el("ol", "classifica"); miei.forEach((m) => ol.append(riga(m, q, "disc"))); box.append(ol);
      if (!miei.length) box.append(el("p", "", "Nessun incontro: prova un altro torneo."));
      return;
    }
    const fin = ORD_DISC.filter((d) => t.finali[d]);
    box.append(el("p", "etichetta", fin.length === 5 ? "Campioni" : "Finali giocate"), el("h2", "", t.nome));
    if (fin.length) { const ol = el("ol", "classifica"); fin.forEach((d) => ol.append(riga(t.finali[d], q, "disc"))); box.append(ol); }
    else box.append(el("p", "", "Le finali non sono ancora state giocate."));
    const schede = el("div", "schede"); schede.setAttribute("role", "group"); schede.setAttribute("aria-label", "Specialità");
    ORD_DISC.filter((d) => t.conta[d]).forEach((d) => {
      const b = el("button", "", d); b.type = "button"; b.title = DISC[d]; b.setAttribute("aria-pressed", d === disc);
      b.addEventListener("click", () => { disc = d; dettaglio(); }); schede.append(b);
    });
    if (!t.conta[disc]) disc = ORD_DISC.find((d) => t.conta[d]);
    box.append(schede, el("p", "sezione", `${DISC[disc]} · tabellone principale (${t.conta[disc]} incontri)`));
    const ol = el("ol", "classifica lunga"); t.ms.filter((m) => m.d === disc).forEach((m) => ol.append(riga(m, q, "turno"))); box.append(ol);
  }

  function carta(t) {
    const futuro = !t.ms.length;
    const b = el("button", "carta" + (futuro ? " futuro" : "")); b.type = "button"; b.setAttribute("aria-pressed", t.nome === scelto);
    const ic = el("span", "icona", t.stato === "annullato" ? "✖️" : futuro ? "🗓️" : "🏸"); ic.setAttribute("aria-hidden", "true");
    const h = el("h3", "", t.nome), s = el("small"); s.append(el("i", "cat" + (t.categoria === "Super 300" ? " s300" : "")), `${t.categoria} · ${periodo(t)}`); h.prepend(s);
    const m = el("span", "mini", futuro ? "–" : String(t.ms.length)); m.prepend(cerchio(58, 6, t.ms.length / PER_TORNEO * 100));
    const barra = el("div", "barra");
    ORD_DISC.forEach((d) => { if (!t.conta[d]) return; const i = el("i", d); i.style.width = (t.conta[d] / PER_TORNEO * 100) + "%"; i.title = `${d}: ${t.conta[d]}`; barra.append(i); });
    const cifre = el("div", "cifre");
    const cognome = (n) => { const c = n.split(/\s+/).filter((w) => w.length > 1 && w === w.toUpperCase() && /\p{L}/u.test(w)); return c.length ? c.join(" ") : n; };
    const vince = (d) => (t.finali[d] ? cognome(t.finali[d].p1) : "–");
    [[vince("MS"), "Vince MS"], [vince("WS"), "Vince WS"], [futuro ? t.stato : (t.luogo || "").split(",")[0] || t.stato, futuro ? "Stato" : "Sede"]].forEach(([n, l]) => {
      const d = el("div"); d.append(el("b", "", n), el("span", "", l)); d.title = n; cifre.append(d);
    });
    b.append(ic, h, m, barra, cifre);
    b.title = futuro ? t.stato : `${t.ms.length} incontri`;
    b.addEventListener("click", () => {
      scelto = scelto === t.nome ? null : t.nome; dettaglio(); griglia();
      if (scelto && window.innerWidth < 900) $("dettaglio").scrollIntoView({ block: "center" });
    });
    return b;
  }

  function griglia() {
    const q = domanda();
    const lista = tornei
      .filter((t) => categoria === "tutte" || t.categoria === categoria)
      .filter((t) => statof === "tutti" || (statof === "concluso" ? t.stato === "concluso" : t.stato !== "concluso"))
      .filter((t) => !q || t.ms.some((m) => corrisponde(m, q)));
    const g = $("griglia"); g.textContent = "";
    lista.forEach((t) => g.append(carta(t)));
    if (!lista.length) g.append(el("p", "vuoto", "Nessun torneo corrisponde ai filtri."));
  }

  function nazioni() {
    const box = $("nazioni"); box.textContent = "";
    box.append(el("h2", "", "Titoli per NOC"));
    const t = el("div", "titoli");
    classificaTitoli.forEach(([n, k]) => {
      const b = el("button", "chip", `${n} · ${k}`); b.type = "button"; b.title = `Mostra i tornei con giocatori ${n}`;
      b.addEventListener("click", () => { cerca(n); window.scrollTo({ top: 0, behavior: "smooth" }); });
      t.append(b);
    });
    if (!classificaTitoli.length) t.append(el("span", "", "Nessuna finale ancora giocata."));
    box.append(t);
  }

  function cerca(testo) {
    $("cerca").value = testo; $("cerca").dispatchEvent(new Event("input"));
  }

  function bottoni(id, voci, get, set) {
    const box = $(id);
    const disegna = () => { box.textContent = ""; Object.entries(voci).forEach(([k, t]) => { const b = el("button", "", t); b.type = "button"; b.setAttribute("aria-pressed", k === get()); b.addEventListener("click", () => { set(k); disegna(); griglia(); }); box.append(b); }); };
    disegna();
  }
  bottoni("categoria", CATEGORIE, () => categoria, (k) => { categoria = k; });
  bottoni("statof", STATI, () => statof, (k) => { statof = k; });
  $("cerca").addEventListener("input", () => {
    const q = domanda();
    const qui = tornei.find((t) => t.nome === scelto);
    if (q && !(qui && qui.ms.some((m) => corrisponde(m, q)))) {
      const trovati = tornei.filter((t) => t.ms.some((m) => corrisponde(m, q)));
      if (trovati.length) scelto = trovati[trovati.length - 1].nome;
    }
    dettaglio(); griglia();
  });

  $("nota").textContent = `Risultati del tabellone principale dei tornei BWF World Tour Super 500 e Super 300 (qualificazioni escluse), letti ogni mattina dall'agente badminton dal sito ufficiale BWF e salvati nel database Notion «Agente Badminton». In ogni riga il vincitore è scritto per primo; «b.» significa «batte». Nei doppi con giocatori di nazioni diverse compaiono entrambi i NOC. w.o. = walkover, rit. = ritiro.`;

  function stampa() {
    const box = $("stampa"); box.textContent = "";
    box.append(el("p", "s-occ", $("data").textContent), el("h1", "", "🏸 Albo d'oro · BWF Super 300 e 500"));
    box.append(el("p", "s-sint", `${num(conclusi.length)} tornei conclusi su ${num(validi.length)} in calendario, ${num(incontri.length)} incontri, ${num(nocTutti.size)} NOC.` + (classificaTitoli.length ? ` Titoli: ${classificaTitoli.slice(0, 8).map(([n, k]) => n + " " + k).join(", ")}.` : "")));
    const gr = el("div", "s-griglia");
    tornei.filter((t) => Object.keys(t.finali).length).forEach((t) => {
      const sec = el("section", "s-cat");
      sec.append(el("h2", "", t.nome), el("p", "s-sub", [t.categoria, periodo(t) + " " + t.inizio.slice(0, 4), t.luogo].filter(Boolean).join(" · ")));
      const tb = el("table"), th = el("tr");
      ["", "Vincitore", "Finalista", "Punteggio"].forEach((x) => th.append(el("th", "", x)));
      tb.append(th);
      ORD_DISC.filter((d) => t.finali[d]).forEach((d) => {
        const m = t.finali[d], tr = el("tr");
        tr.append(el("td", "v", d), el("td", "", `${m.p1} (${m.n1})`), el("td", "", `${m.p2} (${m.n2})`), el("td", "n", m.s.replace(/^\d+-\d+\s*/, "").replace(/[()]/g, "")));
        tb.append(tr);
      });
      sec.append(tb); gr.append(sec);
    });
    box.append(gr, el("p", "s-nota", $("nota").textContent));
  }
  stampa();
  const titoloPagina = document.title;
  window.addEventListener("beforeprint", () => { document.title = "Albo d'oro badminton BWF " + dati.aggiornato; });
  window.addEventListener("afterprint", () => { document.title = titoloPagina; });
  $("pdf").addEventListener("click", () => window.print());

  nazioni(); dettaglio(); griglia();
})();
</script>
</body>
</html>
