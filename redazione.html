<!--
  Redazione AI LA28 · web app · versione 1.5 (23/11/2026, schede 48, 50, 51, 52, 56 e 58) · configurata per il progetto Firebase «redazione-la28»
  Novità della 1.5: sugli schermi grandi (MacBook) la pagina si allarga. Da 760 pixel la carta è più larga e i testi
  più grandi; da 1100 pixel la chat sta a sinistra e il pannello «I dati usati» a destra, già aperto.
  Sull'iPhone (sotto i 760 pixel) non cambia niente.
  Novità della 1.1: due uscite al giorno (8 e 20) nella stessa chat, cuore per ogni messaggio, titolo «stamattina» / «stasera».
  Novità della 1.2: le risposte della redazione ai tuoi messaggi (campo «repliche»), la scritta «in attesa di risposta»
  e la bolla 🎟️ del Redattore Pass (Q nuove in Athletes), anche nel pannello dei dati.
  Novità della 1.3: web app installabile (manifest e icone) e NOTIFICHE PUSH su iPhone e Mac con Firebase Cloud
  Messaging: pulsante «🔔 Attiva le notifiche», che salva il «numero di consegna» del dispositivo nella collezione
  Firestore «dispositivi». Servono anche i file redazione-sw.js, redazione-manifest.json e le 3 icone redazione-icona-*.png.
  Novità della 1.4 (con redazione.py 1.7): nel pannello dei dati i piazzamenti della VELA («🥈 2° … su 56») e i
  VINCITORI di ogni prova (bolla 🏆 del Redattore Podi). La chat non cambia: la bolla 🏆 è un messaggio come gli altri.
  Va nel repo pubblico map-q-la28 (GitHub Pages): https://vier80.github.io/map-q-la28/redazione.html

  Cosa fa:
  - legge da Firebase Firestore le edizioni scritte ogni mattina dallo script redazione.py (collezione «edizioni»);
  - le mostra come una chat, con la grafica della carta crema (titolo, sottotitolo, firma):
    per ogni giorno il messaggio delle 8, quello delle 20 e le tue risposte, in ordine di orario;
  - ti fa mettere il cuore al messaggio e rispondere (le risposte restano salvate in Firestore):
    la redazione ti risponde al lancio successivo (alle 8, alle 20 o con il cron-job delle risposte);
  - si entra con il proprio account Google: le REGOLE di Firestore lasciano leggere e scrivere solo te.

  Già configurata: FIREBASE_CONFIG (scheda 48, passo 4) e chiave VAPID_KEY per le notifiche (scheda 52, inserita il 22/11/2026).
  Senza FIREBASE_CONFIG la pagina mostrerebbe un'ANTEPRIMA con dati di esempio.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- colori presi dalla foto ---------- */
  :root {
    --sfondo: #fbfaf8;        /* pagina */
    --carta: #f3efe6;         /* la carta crema */
    --bordo: #e2dccf;
    --rosso: #a3382c;         /* fascia in alto e seconda riga del sottotitolo */
    --inchiostro: #1b1a18;    /* titolo */
    --grigio: #7b7167;        /* sottotitolo e firma */
    --bolla: #ededee;         /* messaggio della redazione */
    --nero: #141414;          /* le tue risposte */
    --cuore: #c0392b;
    --piccolo: #8e8e93;       /* orari e etichette nella chat */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--sfondo); color: var(--inchiostro);
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .pagina { max-width: 460px; margin: 0 auto; padding: 18px 14px 40px; }

  /* ---------- scelta del giorno ---------- */
  .giorni { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .giorni button {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--bordo);
    background: #fff; font-size: 20px; color: var(--inchiostro); cursor: pointer;
  }
  .giorni button:disabled { opacity: .3; cursor: default; }
  .giorni .quale { font-family: "Lora", serif; font-style: italic; color: var(--grigio); font-size: 15px; }

  /* ---------- la carta ---------- */
  .carta {
    background: var(--carta); border: 1px solid var(--bordo); border-radius: 22px;
    overflow: hidden; padding: 0 0 26px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .fascia { height: 9px; background: var(--rosso); }
  h1 {
    font-family: "Lora", serif; font-weight: 700; font-size: 34px; line-height: 1.15;
    text-align: center; margin: 64px 24px 18px;
  }
  .sotto {
    font-family: "Lora", serif; font-style: italic; font-size: 18px; line-height: 1.35;
    text-align: center; color: var(--grigio); margin: 0 24px;
  }
  .sotto.rosso { color: var(--rosso); }

  /* ---------- la finestra della chat ---------- */
  .chat {
    background: #fff; margin: 34px 14px 0; border-radius: 16px; padding: 14px 12px 10px;
    box-shadow: 0 6px 22px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  }
  .ora { text-align: center; font-size: 11px; color: var(--piccolo); margin: 10px 0 8px; }
  .etichetta { text-align: center; font-size: 11px; color: var(--piccolo); margin: 8px 0 4px; }
  .riga { display: flex; align-items: flex-end; gap: 6px; margin: 2px 0; }
  .riga.destra { justify-content: flex-end; }
  .bolla {
    max-width: 84%; padding: 9px 12px; border-radius: 16px; font-size: 13.5px; line-height: 1.45;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .bolla.grigia { background: var(--bolla); border-bottom-left-radius: 5px; }
  .bolla.nera { background: var(--nero); color: #fff; border-bottom-right-radius: 5px; }
  .cuore {
    border: 0; background: none; cursor: pointer; font-size: 17px; padding: 2px;
    color: #c9c9ce; line-height: 1; transition: transform .15s;
  }
  .cuore.acceso { color: var(--cuore); }
  .attesa { text-align: right; font-size: 11px; color: var(--piccolo); margin: 3px 4px 0; }
  .cuore:active { transform: scale(1.3); }

  /* ---------- casella per rispondere ---------- */
  .scrivi { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #f0f0f2; padding-top: 10px; }
  .scrivi input {
    flex: 1; border: 1px solid #e3e3e8; border-radius: 20px; padding: 9px 14px;
    font: inherit; font-size: 14px; outline: none; min-width: 0;
  }
  .scrivi input:focus { border-color: #b9b9c0; }
  .scrivi button {
    width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--nero); color: #fff;
    font-size: 16px; cursor: pointer; flex: none;
  }
  .scrivi button:disabled { opacity: .35; }

  /* ---------- dati usati (per controllare che l'AI non inventi) ---------- */
  .dati { margin: 18px 14px 0; font-size: 13px; color: #3d3a36; }
  .dati summary { cursor: pointer; color: var(--grigio); font-family: "Lora", serif; font-style: italic; font-size: 15px; }
  .dati ul { list-style: none; padding: 0; margin: 10px 0 0; }
  .dati li { padding: 6px 0; border-bottom: 1px dashed var(--bordo); line-height: 1.4; }
  .dati .sport { font-weight: 600; margin-top: 10px; border: 0; }
  .dati .conti { color: var(--grigio); font-size: 12px; margin-top: 8px; }
  .dati .uscita { font-family: "Lora", serif; font-style: italic; color: var(--rosso); border: 0; margin-top: 14px; }

  .firma { font-family: "Lora", serif; font-style: italic; font-size: 19px; color: var(--grigio); text-align: center; margin: 34px 0 0; }

  /* ---------- avvisi, accesso ---------- */
  .avviso {
    background: #fff7e6; border: 1px solid #f1d9a6; color: #6b4e12; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 12px; line-height: 1.4;
  }
  .vuoto { text-align: center; color: var(--grigio); font-size: 14px; padding: 18px 8px; line-height: 1.5; white-space: pre-line; }
  .bottone {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 22px; cursor: pointer;
    background: var(--nero); color: #fff; font: 500 14px "Inter", sans-serif; padding: 11px 20px;
  }
  .piede { text-align: center; margin-top: 16px; font-size: 12px; color: var(--piccolo); }
  .piede button { border: 0; background: none; color: var(--piccolo); text-decoration: underline; cursor: pointer; font: inherit; }
  .nascosto { display: none !important; }

  /* ---------- notifiche ---------- */
  .notifiche { text-align: center; font-size: 13px; color: var(--grigio); margin: 0 0 12px; line-height: 1.45; }
  .notifiche .bottone { font-size: 13px; padding: 9px 16px; }

  /* =====================================================================================
     SCHERMI GRANDI (novità 1.5). Le regole qui sotto valgono SOLO se la finestra è larga
     almeno 760 o 1100 pixel: sull'iPhone vale tutto quello che c'è sopra, senza cambiamenti.
     ===================================================================================== */

  /* --- tablet e finestre medie: carta più larga, testi un po' più grandi --- */
  @media (min-width: 760px) {
    .pagina { max-width: 820px; padding: 28px 24px 60px; }
    h1 { font-size: 46px; margin: 72px 40px 20px; }
    .sotto { font-size: 21px; }
    .chat { margin: 38px 36px 0; padding: 18px 20px 14px; border-radius: 18px; }
    .bolla { font-size: 15px; max-width: 74%; padding: 11px 15px; }
    .ora, .etichetta { font-size: 12px; }
    .scrivi input { font-size: 15px; padding: 11px 16px; }
    .scrivi button { width: 42px; height: 42px; }
    .dati { margin: 22px 36px 0; font-size: 14px; }
    .notifiche { font-size: 14px; }
  }

  /* --- MacBook e schermi larghi: chat a sinistra, dati a destra --- */
  @media (min-width: 1100px) {
    .pagina { max-width: 1240px; }
    /* la carta diventa una griglia a due colonne: la chat prende circa il 60% dello spazio */
    .carta {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
      column-gap: 0;
      overflow: visible;          /* «hidden» impedirebbe al pannello dei dati di restare fermo mentre scorri */
    }
    .fascia { border-radius: 22px 22px 0 0; }    /* gli angoli che prima tagliava «overflow: hidden» */
    .carta > * { grid-column: 1 / -1; }          /* fascia, titolo, sottotitoli e firma: tutta la larghezza */
    .carta > .chat { grid-column: 1; grid-row: 5; margin: 40px 18px 0 40px; align-self: start; }
    .carta > .dati {
      grid-column: 2; grid-row: 5; align-self: start;
      margin: 40px 40px 0 18px; background: #fff; border-radius: 18px; padding: 16px 18px;
      box-shadow: 0 6px 22px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
      /* il pannello resta visibile mentre scorri una chat lunga */
      position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow-y: auto;
    }
    /* senza dati da mostrare la chat si prende tutta la larghezza */
    .carta:has(> .dati.nascosto) > .chat { grid-column: 1 / -1; margin: 40px 40px 0; }
    h1 { font-size: 52px; margin-top: 80px; }
    .bolla { max-width: 78%; }
  }
</style>
</head>
<body>
<main class="pagina">
  <div id="avviso" class="avviso nascosto"></div>

  <nav class="giorni" id="giorni">
    <button id="prima" aria-label="Giorno precedente">‹</button>
    <span class="quale" id="quale">…</span>
    <button id="dopo" aria-label="Giorno seguente">›</button>
  </nav>

  <div class="notifiche nascosto" id="notifiche"></div>

  <article class="carta">
    <div class="fascia"></div>
    <h1 id="titolo">I miei ragazzi<br>stamattina</h1>
    <p class="sotto" id="sotto1">Redazione LA28</p>
    <p class="sotto rosso" id="sotto2">La mia redazione AI ha letto i risultati</p>

    <section class="chat" id="chat">
      <div class="vuoto">Caricamento…</div>
    </section>

    <details class="dati nascosto" id="dati">
      <summary id="datiTitolo">I dati usati dalla redazione</summary>
      <ul id="datiLista"></ul>
      <div class="conti" id="datiConti"></div>
    </details>

    <p class="firma" id="firma">Gualtiero</p>
  </article>

  <div class="piede" id="piede"></div>
</main>

<script type="module">
// =====================================================================================
// 1) CONFIGURAZIONE: incolla qui i valori della tua web app Firebase
//    (Console Firebase -> ⚙️ Impostazioni progetto -> Le tue app -> </> -> «firebaseConfig»).
//    Questi valori NON sono segreti: servono solo a trovare il progetto. La sicurezza la fanno
//    le regole di Firestore (scheda 48), che lasciano entrare solo il tuo account Google.
// =====================================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAr6K6l5o3hCzq2woc54Sx5XmDGKd9e8vU",
  authDomain: "redazione-la28.firebaseapp.com",
  projectId: "redazione-la28",
  storageBucket: "redazione-la28.firebasestorage.app",
  messagingSenderId: "875557376372",
  appId: "1:875557376372:web:1ce4e8593cc93a92319c21",
};
// Chiave pubblica per le notifiche web (NON segreta): Console Firebase -> ⚙️ Impostazioni progetto ->
// Cloud Messaging -> Configurazione Web -> Certificati push web -> «Coppia di chiavi» (scheda 52, passo 1)
const VAPID_KEY = "BNu0KcTSrSM136PNKzLtrMIK_XqU3ONhzQBP-KyYT6JBbHliOQfmDYZg9NorD-TI7NWyrfZOR98yccG-byUkf2w";
const NOME = "Gualtiero";              // la firma in fondo alla carta
const COLLEZIONE = "edizioni";         // la stessa di redazione.py
const VERSIONE_FIREBASE = "10.14.1";   // versione delle librerie Firebase scaricate da Google

// =====================================================================================
// 2) PICCOLI AIUTANTI
// =====================================================================================
const $ = (id) => document.getElementById(id);
const GIORNI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
const GIORNI_BREVI = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio",
              "agosto", "settembre", "ottobre", "novembre", "dicembre"];

// crea un elemento HTML con una classe e un testo (il testo è sempre «testo», mai HTML: niente sorprese)
function el(tag, classe, testo) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (testo !== undefined) e.textContent = testo;
  return e;
}
// «2026-11-22» del giorno di oggi, in ora locale
function oggiISO(spostamento = 0) {
  const d = new Date(); d.setDate(d.getDate() + spostamento);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function daISO(s) { const [a, m, g] = s.split("-").map(Number); return new Date(a, m - 1, g); }
// come chiamare un giorno: «Oggi», «Ieri» o «sab 21/11»
function nomeGiorno(iso) {
  if (iso === oggiISO()) return "Oggi";
  if (iso === oggiISO(-1)) return "Ieri";
  const d = daISO(iso);
  return `${GIORNI_BREVI[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`;
}
function mostraAvviso(testo) { $("avviso").textContent = testo; $("avviso").classList.toggle("nascosto", !testo); }

// =====================================================================================
// 3) DISEGNO DELLA PAGINA (uguale per l'anteprima e per Firebase)
// =====================================================================================
let edizioni = [];        // tutte le edizioni, dalla più recente
let indice = 0;           // quale edizione si sta guardando (0 = la più recente)
let servizio = null;      // chi legge e scrive i dati: Firebase oppure l'anteprima
let pannelloAperto = false;   // il pannello dei dati è già stato aperto da solo (schermi larghi)?

function disegna() {
  const chat = $("chat");
  chat.replaceChildren();
  $("firma").textContent = NOME;
  $("dati").classList.add("nascosto");

  if (!edizioni.length) {
    $("quale").textContent = "—";
    $("prima").disabled = $("dopo").disabled = true;
    chat.append(el("div", "vuoto", "Nessuna edizione ancora.\nLancia «Redazione AI LA28» su GitHub (Actions → Run workflow)."));
    return;
  }
  const ed = edizioni[indice];
  const d = daISO(ed.data);

  // --- navigazione tra i giorni
  $("quale").textContent = nomeGiorno(ed.data);
  $("prima").disabled = indice >= edizioni.length - 1;     // più vecchia
  $("dopo").disabled = indice <= 0;                         // più recente

  // --- titolo e sottotitolo come nella foto
  const messaggi = [...(ed.messaggi || [])];
  const haSera = messaggi.some(m => m.uscita === "sera");
  const quando = ed.data === oggiISO() ? (haSera ? "stasera" : "stamattina")
               : ed.data === oggiISO(-1) ? "ieri"
               : GIORNI[d.getDay()];
  $("titolo").replaceChildren("I miei ragazzi", document.createElement("br"), quando);
  $("sotto1").textContent = `Redazione LA28 · ${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;
  const conAI = messaggi.some(m => String(m.firma || "").startsWith("Gemini"));
  $("sotto2").textContent = conAI ? "La mia redazione AI ha letto i risultati"
                                  : "La redazione ha letto i risultati (senza AI)";

  // --- una sola cronologia: messaggi della redazione (8 e 20) e tue risposte, in ordine di orario
  const cronologia = [];
  for (const m of messaggi) {
    const [h, min] = String(m.ora || "00:00").split(":").map(Number);
    const t = daISO(ed.data); t.setHours(h || 0, min || 0);
    cronologia.push({ tipo: "redazione", t, m });
  }
  const risposteDate = new Set((ed.repliche || []).map(x => x.a));   // a quali tuoi messaggi la redazione ha già risposto
  for (const r of ed.risposte || []) {
    const t = new Date(r.ora);
    cronologia.push({ tipo: "risposta", t: isNaN(t) ? new Date(0) : t, r, risposta: risposteDate.has(r.ora) });
  }
  for (const x of ed.repliche || []) {
    const t = new Date(x.ora);
    cronologia.push({ tipo: "replica", t: isNaN(t) ? new Date(0) : t, x });
  }
  // a parità di orario: prima il caporedattore, poi la bolla 🎟️ dei pass, poi la bolla 🏆 dei vincitori
  const posto = v => {
    if (v.tipo !== "redazione") return 0;
    const k = v.m.chiave || v.m.uscita || "";
    return k.endsWith("-pass") ? 1 : k.endsWith("-podi") ? 2 : 0;
  };
  cronologia.sort((a, b) => (a.t - b.t) || (posto(a) - posto(b)));

  for (const voce of cronologia) {
    const orario = `${voce.t.getHours()}:${String(voce.t.getMinutes()).padStart(2, "0")}`;
    chat.append(el("div", "ora", `${nomeGiorno(oggiISOda(voce.t))} ${orario}`));
    if (voce.tipo === "redazione") {
      // bolla grigia a sinistra, con il cuore di QUESTO messaggio
      const m = voce.m, chiave = m.chiave || m.uscita || "mattina";   // es. «sera» o «sera-pass»
      const acceso = cuoreAcceso(ed, chiave);
      const riga = el("div", "riga");
      riga.append(el("div", "bolla grigia", m.testo || ""));
      const cuore = el("button", "cuore" + (acceso ? " acceso" : ""), "♥");
      cuore.title = acceso ? "Togli il cuore" : "Metti il cuore";
      cuore.setAttribute("aria-label", cuore.title);
      cuore.onclick = () => servizio.cuore(ed.id, nuoviCuori(ed, chiave)).catch(erroreScrittura);
      riga.append(cuore);
      chat.append(riga);
      chat.append(el("div", "etichetta", `Messaggio da ${m.emoji || "🤖"} ${m.autore || "Redazione"}${m.firma ? " · " + m.firma : ""}`));
    } else if (voce.tipo === "replica") {
      // risposta della redazione a un tuo messaggio: bolla grigia a sinistra
      const riga = el("div", "riga");
      riga.append(el("div", "bolla grigia", voce.x.testo || ""));
      chat.append(riga);
      chat.append(el("div", "etichetta", "Risposta da 🤖 Caporedattore"));
    } else {
      // tua risposta: bolla nera a destra
      const riga = el("div", "riga destra");
      riga.append(el("div", "bolla nera", voce.r.testo));
      chat.append(riga);
      if (!voce.risposta) chat.append(el("div", "attesa", "⏳ in attesa di risposta"));
    }
  }

  // --- casella per rispondere
  const modulo = el("form", "scrivi");
  const casella = el("input");
  casella.placeholder = "Rispondi alla redazione…";
  casella.maxLength = 500;
  const invia = el("button", "", "➤");
  invia.type = "submit";
  invia.setAttribute("aria-label", "Invia");
  modulo.append(casella, invia);
  modulo.onsubmit = async (ev) => {
    ev.preventDefault();
    const testo = casella.value.trim();
    if (!testo) return;
    invia.disabled = true;
    try { await servizio.rispondi(ed.id, testo); casella.value = ""; }
    catch (e) { erroreScrittura(e); }
    finally { invia.disabled = false; }
  };
  chat.append(modulo);

  disegnaDati(ed);
}
// il campo «cuore» è un elenco per messaggio, es. {mattina: true, sera: false, "sera-pass": true}.
// Le edizioni della versione 1.0 avevano un solo sì/no: vale per tutti i messaggi del giorno.
function cuoreAcceso(ed, chiave) {
  if (ed.cuore && typeof ed.cuore === "object") return !!ed.cuore[chiave];
  return !!ed.cuore;
}
function nuoviCuori(ed, chiave) {
  const cuori = (ed.cuore && typeof ed.cuore === "object") ? { ...ed.cuore }
              : Object.fromEntries((ed.messaggi || []).map(m => [m.chiave || m.uscita || "mattina", !!ed.cuore]));
  cuori[chiave] = !cuori[chiave];
  return cuori;
}
function oggiISOda(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// il pannello «I dati usati»: gli incontri da cui la redazione ha scritto, uscita per uscita
function disegnaDati(ed) {
  const SEGNI = { "vittoria": "✅", "sconfitta": "❌", "derby italiano": "🇮🇹" };
  // dalla versione 1.4 dello script ogni messaggio ha i suoi dati; prima stavano nell'edizione
  const gruppi = (ed.messaggi || []).filter(m => m.notizie).map(m => ({
    titolo: `${m.uscita === "sera" ? "🌙 Sera" : "☀️ Mattina"} · ${m.periodo || ""}`,
    notizie: m.notizie, totale: m.notizie_totali ?? m.notizie.length,
    conteggi: m.conteggi || [], problemi: m.problemi || [] }));
  // i pass nuovi del Redattore Pass (dalla versione 1.5 dello script)
  const pass = (ed.messaggi || []).filter(m => (m.nuovi_pass || []).length);
  if (!gruppi.length) gruppi.push({ titolo: "", notizie: ed.notizie || [],
    totale: ed.notizie_totali ?? (ed.notizie || []).length, conteggi: ed.conteggi || [], problemi: ed.problemi || [] });

  // i vincitori di ogni prova del Redattore Podi (dalla versione 1.7 dello script)
  const podi = (ed.messaggi || []).filter(m => (m.podi || []).length);

  const totale = gruppi.reduce((a, g) => a + g.totale, 0);
  // sugli schermi larghi (novità 1.5) il pannello sta a destra della chat: lo apro subito, una volta sola
  if (!pannelloAperto && window.matchMedia("(min-width: 1100px)").matches) { $("dati").open = true; pannelloAperto = true; }
  $("dati").classList.remove("nascosto");
  $("datiTitolo").textContent = `I dati usati dalla redazione (${totale} risultati con italiani)`;
  const lista = $("datiLista");
  lista.replaceChildren();
  const conti = [];
  for (const g of gruppi) {
    if (g.titolo && gruppi.length > 0) lista.append(el("li", "uscita", g.titolo));
    let sport = null;
    for (const n of g.notizie) {
      if (n.sport !== sport) { sport = n.sport; lista.append(el("li", "sport", `${n.emoji || ""} ${sport}`.trim())); }
      if (n.tipo === "classifica") {
        // vela: piazzamento di una barca italiana, es. «🥈 2° Riccardo Pianosi (ITA) su 56 · Formula Kite maschile · …»
        const dove = [n.prova, n.torneo].filter(Boolean).join(" · ");
        const su = n.barche ? ` su ${n.barche}` : "";
        lista.append(el("li", "", `${medaglia(n.posizione)} ${n.posizione ? n.posizione + "°" : "?"} ${n.barca} (${n.noc})${su} · ${dove}`));
        continue;
      }
      const dove = [n.turno, n.prova, n.torneo].filter(Boolean).join(" · ");
      lista.append(el("li", "", `${SEGNI[n.esito_per_l_italia] || "❔"} ${conNoc(n.vincitore, n.noc_vincitore)} b. ${conNoc(n.sconfitto, n.noc_sconfitto)} ${n.punteggio || ""} · ${dove}`));
    }
    if (!g.notizie.length) lista.append(el("li", "", "Nessun risultato con italiani."));
    const c = g.conteggi.map(c => `${c.sport}: ${c.incontri_nuovi - (c.storici_esclusi || 0)} recenti`).join(" · ");
    const p = g.problemi.length ? ` · ⚠️ non letti: ${g.problemi.join(", ")}` : "";
    if (c || p) conti.push(`${g.titolo ? g.titolo.split(" · ")[0] + ": " : ""}${c}${p}`);
  }
  for (const m of pass) {
    lista.append(el("li", "uscita", `🎟️ Nuovi pass · ${m.uscita === "sera" ? "sera" : "mattina"} · ${m.periodo || ""}`));
    for (const a of m.nuovi_pass) {
      const dettagli = [a.sport, a.disciplina].filter(Boolean).join(" · ");
      lista.append(el("li", "", `${a.italiano ? "🇮🇹" : "🌍"} ${a.nome} (${a.noc}) · ${dettagli}`));
    }
  }
  for (const m of podi) {
    lista.append(el("li", "uscita", `🏆 Vincitori · ${m.uscita === "sera" ? "sera" : "mattina"} · ${m.periodo || ""}`));
    let gruppo = null;
    for (const p of m.podi) {
      const chiave = `${p.sport}|${p.torneo}`;
      if (chiave !== gruppo) { gruppo = chiave; lista.append(el("li", "sport", `${p.emoji || ""} ${p.sport} · ${p.torneo || ""}`.trim())); }
      lista.append(el("li", "", rigaVincitore(p)));
    }
  }
  $("datiConti").textContent = conti.join("\n");
  $("datiConti").style.whiteSpace = "pre-line";
}
// 🥇 🥈 🥉 per i primi tre, 🔹 per gli altri (piazzamenti della vela)
function medaglia(pos) { return { 1: "🥇", 2: "🥈", 3: "🥉" }[pos] || "🔹"; }
// «Nome Cognome (NOC)»; nelle gare a squadre il nome è già la sigla: solo «ITA»
function conNoc(nome, noc) {
  nome = nome || "";
  return !noc || nome.trim().toUpperCase() === noc.trim().toUpperCase() ? nome : `${nome} (${noc})`;
}
// una riga dei vincitori, uguale a quella scritta da redazione.py (funzione riga_vincitore)
function rigaVincitore(p) {
  const prova = p.prova || "prova", v = conNoc(p.vincitore, p.noc_vincitore), s = conNoc(p.sconfitto, p.noc_sconfitto);
  let riga;
  if (p.tipo === "classifica") riga = `🥇 ${prova}: ${v}${p.barche ? ` · ${p.barche} barche` : ""}`;
  else if (p.da_verificare) riga = `❔ ${prova}: finale ${v} - ${s}, vincitore da verificare`;
  else riga = `🥇 ${prova}: ${v} b. ${s}${p.punteggio ? " " + p.punteggio : ""}`;
  return riga + (p.italiano ? " 🇮🇹" : "");
}

function erroreScrittura(e) {
  console.error(e);
  mostraAvviso("Non sono riuscito a salvare: " + (e?.code || e?.message || e) + ". Controlla le regole di Firestore (scheda 48).");
}

// quando arrivano edizioni nuove, resta sullo stesso giorno se c'è ancora
function riceviEdizioni(nuove) {
  const giornoVisto = edizioni[indice]?.data;
  edizioni = nuove;
  const i = edizioni.findIndex(e => e.data === giornoVisto);
  indice = i >= 0 ? i : 0;
  disegna();
}

$("prima").onclick = () => { if (indice < edizioni.length - 1) { indice++; disegna(); } };
$("dopo").onclick = () => { if (indice > 0) { indice--; disegna(); } };

// =====================================================================================
// 5) FIREBASE: accesso con Google e lettura/scrittura in Firestore
// =====================================================================================
async function servizioFirebase() {
  const base = `https://www.gstatic.com/firebasejs/${VERSIONE_FIREBASE}`;
  const { initializeApp } = await import(`${base}/firebase-app.js`);
  const A = await import(`${base}/firebase-auth.js`);
  const F = await import(`${base}/firebase-firestore.js`);
  // le notifiche: se il modulo non si carica, la redazione funziona lo stesso (solo senza notifiche)
  const M = await import(`${base}/firebase-messaging.js`).catch(() => null);

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  let smetti = null;          // per smettere di ascoltare Firestore quando esci

  // ---------------------------------------------------------------- notifiche push
  const iPhone = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const installata = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

  // un nome riconoscibile per il dispositivo, salvato insieme al suo «numero di consegna»
  function nomeDispositivo() {
    const ua = navigator.userAgent;
    const tipo = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Macintosh/.test(ua) ? "Mac" : "Computer";
    return `${tipo} · ${installata ? "app" : "browser"}`;
  }
  // l'id del documento: un'impronta (SHA-256) del numero di consegna, che è troppo lungo per fare da nome
  async function impronta(testo) {
    const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(testo));
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 40);
  }
  // chiede a Firebase il «numero di consegna» (token) di questo dispositivo e lo salva in Firestore
  async function registraDispositivo(utente) {
    const reg = await navigator.serviceWorker.register("redazione-sw.js");
    const token = await M.getToken(M.getMessaging(app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error("Firebase non ha dato il numero di consegna");
    await F.setDoc(F.doc(db, "dispositivi", await impronta(token)),
      { token, email: utente.email, nome: nomeDispositivo(), aggiornato: F.serverTimestamp() });
  }
  async function preparaNotifiche(utente) {
    const box = $("notifiche");
    box.classList.remove("nascosto");
    box.replaceChildren();
    const supportate = M && "serviceWorker" in navigator && "Notification" in window
                       && await M.isSupported().catch(() => false);
    if (!VAPID_KEY || VAPID_KEY.startsWith("INCOLLA")) {
      box.textContent = "🔕 Notifiche non ancora configurate: manca la chiave VAPID (scheda 52).";
      return;
    }
    if (!supportate) {
      box.textContent = iPhone && !installata
        ? "🔔 Per le notifiche su iPhone: tocca Condividi ↑ → «Aggiungi alla schermata Home», poi apri la Redazione dalla sua icona e torna qui."
        : "🔕 Questo browser non supporta le notifiche push.";
      return;
    }
    if (Notification.permission === "denied") {
      box.textContent = "🔕 Notifiche bloccate: riattivale nelle impostazioni del dispositivo (Notifiche → Redazione).";
      return;
    }
    const attive = "🔔 Notifiche attive su questo dispositivo: arrivano alle 8, alle 20 e quando la redazione ti risponde.";
    if (Notification.permission === "granted") {
      // permesso già dato: rinnovo in silenzio il numero di consegna (ogni tanto Firebase lo cambia)
      try { await registraDispositivo(utente); box.textContent = attive; }
      catch (e) { console.error(e); box.textContent = "⚠️ Notifiche: " + (e.code || e.message); }
      return;
    }
    const b = el("button", "bottone", "🔔 Attiva le notifiche su questo dispositivo");
    b.onclick = async () => {
      // la richiesta di permesso deve partire SUBITO dal tocco del pulsante (regola di iPhone)
      const permesso = await Notification.requestPermission();
      if (permesso !== "granted") { box.textContent = "🔕 Permesso non concesso: nessuna notifica su questo dispositivo."; return; }
      box.textContent = "Attivo le notifiche…";
      try { await registraDispositivo(utente); box.textContent = attive; }
      catch (e) { console.error(e); box.textContent = "⚠️ Non sono riuscito ad attivare le notifiche: " + (e.code || e.message); }
    };
    box.append(b);
  }

  function schermataAccesso() {
    $("notifiche").classList.add("nascosto");
    $("giorni").classList.add("nascosto");
    $("dati").classList.add("nascosto");
    const chat = $("chat");
    chat.replaceChildren(el("div", "vuoto", "La redazione è riservata.\nEntra con il tuo account Google."));
    const b = el("button", "bottone", "Entra con Google");
    b.onclick = async () => {
      try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); }
      catch (e) {
        // se il telefono blocca la finestra, si passa al cambio di pagina
        if (e.code === "auth/popup-blocked") await A.signInWithRedirect(auth, new A.GoogleAuthProvider());
        else if (e.code !== "auth/popup-closed-by-user") mostraAvviso("Accesso non riuscito: " + e.code + " (il dominio è tra quelli autorizzati? scheda 48)");
      }
    };
    const centro = el("div", "vuoto"); centro.append(b);
    chat.append(centro);
    $("piede").replaceChildren();
  }

  A.onAuthStateChanged(auth, (utente) => {
    if (smetti) { smetti(); smetti = null; }
    if (!utente) { schermataAccesso(); return; }
    mostraAvviso("");
    $("giorni").classList.remove("nascosto");
    const esci = el("button", "", "esci");
    esci.onclick = () => A.signOut(auth);
    $("piede").replaceChildren(`Dentro come ${utente.email} · `, esci);
    preparaNotifiche(utente);

    // ascolto «in diretta»: se la redazione pubblica mentre la pagina è aperta, compare subito
    const q = F.query(F.collection(db, COLLEZIONE), F.orderBy("data", "desc"), F.limit(60));
    smetti = F.onSnapshot(q,
      (foto) => riceviEdizioni(foto.docs.map(d => ({ id: d.id, ...d.data() }))),
      (e) => {
        console.error(e);
        $("chat").replaceChildren(el("div", "vuoto",
          e.code === "permission-denied"
            ? `L'account ${utente.email} non è autorizzato.\nNelle regole di Firestore deve esserci questa email (scheda 48).`
            : "Errore di lettura: " + e.code));
      });
  });

  return {
    ascolta() {},   // l'ascolto parte da solo dopo l'accesso
    // si scrive l'intero elenco dei cuori (es. {mattina: true, sera: false}): le regole permettono solo «cuore» e «risposte»
    cuore: (id, cuori) => F.updateDoc(F.doc(db, COLLEZIONE, id), { cuore: cuori }),
    rispondi: (id, testo) => F.updateDoc(F.doc(db, COLLEZIONE, id),
      { risposte: F.arrayUnion({ testo, ora: new Date().toISOString() }) }),
  };
}

// =====================================================================================
// 6) AVVIO
// =====================================================================================
const configurato = !Object.values(FIREBASE_CONFIG).some(v => !v || v === "INCOLLA_QUI");
if (configurato) {
  try {
    servizio = await servizioFirebase();
  } catch (e) {
    console.error(e);
    mostraAvviso("Non riesco a caricare Firebase: controlla la connessione e il blocco FIREBASE_CONFIG.");
  }
} else {
  mostraAvviso("Anteprima con dati di esempio: inserisci la configurazione Firebase (scheda 48, passo 4).");
  $("notifiche").textContent = "🔔 Anteprima: le notifiche si attivano nella pagina online, dopo l'accesso.";
  $("notifiche").classList.remove("nascosto");
  servizio = servizioAnteprima();
  servizio.ascolta(riceviEdizioni);
}
</script>
